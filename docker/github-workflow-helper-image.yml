# Builds the ZeroCosts helper image on GitHub (amd64 + arm64) and publishes it to ghcr.io/<your-user>/zerocosts-helper.
# Put this file at  .github/workflows/helper-image.yml  in a repository that also contains the  docker/  folder from the package.
name: helper-image
on:
  push:
    branches: [main]
    paths: ['docker/**', '.github/workflows/helper-image.yml']
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      # quick check before publishing: build for the runner's own CPU and run the self-test (rustc + debugger)
      - uses: docker/build-push-action@v6
        with: { context: docker, load: true, tags: 'zc-test:latest', cache-from: 'type=gha', cache-to: 'type=gha,mode=max' }
      - name: Self-test
        run: docker run --rm --cap-add=SYS_PTRACE --entrypoint /app/selftest.sh zc-test:latest
        continue-on-error: true      # a debugger problem on the CI runner should not block publishing; read the log
      - uses: docker/build-push-action@v6
        with:
          context: docker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/zerocosts-helper:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
